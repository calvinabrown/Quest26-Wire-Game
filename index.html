<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-BRAID: MOBILE FIX</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --primary: #00f2ff;
            --secondary: #ff00ff;
            --wire: #1a1a20;
            --gate-off: #444;
        }

        /* Use Flexbox to manage the vertical stack */
        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        #ui-header { 
            padding: 10px 0; 
            text-align: center; 
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        h2 { margin: 5px 0; font-size: 1.1rem; letter-spacing: 1px; }
        p.sub-text { margin: 2px 0; font-size: 0.75rem; color: #888; }

        /* Board now takes up the remaining available space */
        #game-board {
            position: relative;
            width: 90vw;
            max-width: 450px;
            margin: 10px auto;
            background: #0d0d0f;
            border: 2px solid #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            flex: 1; /* Key change: Fill the middle space */
            overflow: visible;
        }

        .lane {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: var(--wire);
            z-index: 1;
        }

        .gate-rung {
            position: absolute;
            width: 44px;
            height: 44px;
            background: #151518;
            border: 2px solid var(--gate-off);
            cursor: pointer;
            z-index: 5;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%); 
            touch-action: manipulation;
        }

        .gate-rung.active {
            border-color: var(--secondary);
            background: #300030;
            box-shadow: 0 0 15px var(--secondary);
        }

        .gate-rung::before, .gate-rung::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 20px;
            background: var(--gate-off);
            transition: all 0.2s;
        }

        .gate-rung::before { transform: translateX(-4px); }
        .gate-rung::after { transform: translateX(4px); }

        .gate-rung.active::before { background: var(--secondary); transform: rotate(45deg); }
        .gate-rung.active::after { background: var(--secondary); transform: rotate(-45deg); }

        .node {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: left 0.3s ease-in-out;
        }

        .io-label {
            position: absolute;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--secondary);
            bottom: -25px; /* Stay just below the board */
        }

        /* Controls footer pinned to bottom */
        #ui-footer { 
            padding: 15px 0 25px 0; /* Extra bottom padding for home indicators */
            text-align: center;
            flex-shrink: 0;
        }

        .btn {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 15px;
            cursor: pointer;
            margin: 0 5px;
            font-family: inherit;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .btn:disabled { border-color: #333; color: #333; }

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="ui-header">
    <h2>RECONSTRUCT_SEQUENCE.v2</h2>
    <p class="sub-text">Direct nodes to target zones at the bottom.</p>
</div>

<div id="game-board">
    <div id="lanes-layer"></div>
    <div id="gates-layer"></div>
    <div id="nodes-layer"></div>
</div>

<div id="ui-footer">
    <button class="btn" id="run-btn" onclick="startRun()">START RUN</button>
    <button class="btn" id="regen-btn" onclick="generateLevel()">NEW MAP</button>
</div>

<div id="overlay">
    <h1 id="status-text"></h1>
    <p id="status-sub"></p>
    <button class="btn" onclick="resetUI()">CONTINUE</button>
</div>

<script>
const LANES = 4;
const ROWS = 5; 
const SPAWN_DELAY = 1500; 

let boardW, boardH, laneSpacing, rowSpacing;
let gateStates = [];
let targetOutputs = [];
let currentArrivals = [];
let inputs = [];

function updateDimensions() {
    const board = document.getElementById('game-board');
    boardW = board.clientWidth;
    boardH = board.clientHeight;
    laneSpacing = boardW / (LANES + 1);
    rowSpacing = boardH / (ROWS + 1);
}

function generateLevel() {
    updateDimensions();
    document.getElementById('gates-layer').innerHTML = '';
    document.getElementById('lanes-layer').innerHTML = '';
    gateStates = [];
    currentArrivals = Array(LANES).fill(0);

    for(let i=0; i<LANES; i++) {
        const x = (i + 1) * laneSpacing;
        const l = document.createElement('div');
        l.className = 'lane';
        l.style.left = `${x}px`;
        document.getElementById('lanes-layer').appendChild(l);
    }

    for(let r=0; r<ROWS; r++) {
        const y = (r + 1) * rowSpacing;
        for(let l=0; l<LANES-1; l++) {
            if(Math.random() > 0.45) {
                const xMid = ((l + 1) * laneSpacing) + (laneSpacing / 2);
                const gateObj = { id: `g-${r}-${l}`, row: r, lane: l, active: false, y: y };
                gateStates.push(gateObj);

                const el = document.createElement('div');
                el.className = 'gate-rung';
                el.style.top = `${y}px`;
                el.style.left = `${xMid}px`;
                el.onclick = () => {
                    gateObj.active = !gateObj.active;
                    el.classList.toggle('active');
                };
                document.getElementById('gates-layer').appendChild(el);
            }
        }
    }

    inputs = Array.from({length: 5}, () => Math.floor(Math.random() * LANES));
    targetOutputs = simulate(inputs, gateStates.map(g => ({...g, active: Math.random() > 0.5})));
    drawLabels();
}

function drawLabels() {
    const targets = Array(LANES).fill(0);
    targetOutputs.forEach(t => targets[t]++);

    for(let i=0; i<LANES; i++) {
        const x = (i + 1) * laneSpacing;
        const label = document.createElement('div');
        label.className = 'io-label';
        label.id = `label-${i}`;
        label.style.width = `${laneSpacing}px`;
        label.style.left = `${x - (laneSpacing/2)}px`;
        label.innerText = `0/${targets[i]}`;
        document.getElementById('lanes-layer').appendChild(label);
    }
}

function updateLiveCount(laneIndex) {
    const targets = Array(LANES).fill(0);
    targetOutputs.forEach(t => targets[t]++);
    const label = document.getElementById(`label-${laneIndex}`);
    if (label) {
        label.innerText = `${currentArrivals[laneIndex]}/${targets[laneIndex]}`;
        label.style.color = currentArrivals[laneIndex] === targets[laneIndex] ? 'var(--primary)' : 'var(--secondary)';
    }
}

function simulate(inputArray, currentGates) {
    return inputArray.map(startLane => {
        let lane = startLane;
        const sorted = [...currentGates].sort((a,b) => a.y - b.y);
        sorted.forEach(g => {
            if(g.active) {
                if(lane === g.lane) lane++;
                else if(lane === g.lane + 1) lane--;
            }
        });
        return lane;
    });
}

async function startRun() {
    document.getElementById('nodes-layer').innerHTML = '';
    document.getElementById('run-btn').disabled = true;
    document.getElementById('regen-btn').disabled = true;

    currentArrivals = Array(LANES).fill(0);
    for(let i=0; i<LANES; i++) updateLiveCount(i);

    const animations = inputs.map(async (startLane, i) => {
        await new Promise(r => setTimeout(r, i * SPAWN_DELAY));
        const finalLane = await moveNode(startLane);
        currentArrivals[finalLane]++;
        updateLiveCount(finalLane);
        return finalLane;
    });

    await Promise.all(animations);
    document.getElementById('run-btn').disabled = false;
    document.getElementById('regen-btn').disabled = false;
    checkWin();
}

function moveNode(startLane) {
    return new Promise(resolve => {
        const node = document.createElement('div');
        node.className = 'node';
        document.getElementById('nodes-layer').appendChild(node);
        let currentLane = startLane;
        let y = 0;
        const speed = 2.0; 
        const sortedGates = [...gateStates].sort((a,b) => a.y - b.y);
        let gateIdx = 0;

        function step() {
            y += speed;
            node.style.top = `${y}px`;
            node.style.left = `${(currentLane + 1) * laneSpacing}px`;

            if(gateIdx < sortedGates.length && y >= sortedGates[gateIdx].y) {
                const g = sortedGates[gateIdx];
                if(g.active) {
                    if(currentLane === g.lane) currentLane++;
                    else if(currentLane === g.lane + 1) currentLane--;
                }
                gateIdx++;
            }

            if(y < boardH) requestAnimationFrame(step);
            else resolve(currentLane);
        }
        step();
    });
}

function checkWin() {
    const target = Array(LANES).fill(0);
    targetOutputs.forEach(t => target[t]++);
    const win = currentArrivals.every((v, i) => v === target[i]);
    
    const overlay = document.getElementById('overlay');
    document.getElementById('status-text').innerText = win ? "DECRYPTED" : "REJECTED";
    document.getElementById('status-text').style.color = win ? "var(--primary)" : "var(--secondary)";
    document.getElementById('status-sub').innerText = win ? "SEQUENCE MATCHED." : "CHECKSUM ERROR.";
    overlay.style.display = 'flex';
}

function resetUI() {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('nodes-layer').innerHTML = '';
}

window.addEventListener('resize', () => {
    updateDimensions();
    generateLevel();
});
generateLevel();
</script>
</body>
</html>
